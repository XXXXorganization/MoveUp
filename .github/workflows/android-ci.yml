name: Android CI/CD Pipeline

# 触发条件：当代码推送到 main 分支，或者提交 PR 时自动运行
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 任务 1：基础构建与快速测试 (Robolectric)
  # ==========================================
  build-and-fast-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码 (Checkout code)
        uses: actions/checkout@v4

      - name: ☕ 设置 JDK 17 环境 (Setup JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17' # 如果你的项目用的是 Java 8，请改为 '8'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 赋予 Gradle 运行权限
        run: chmod +x gradlew

      - name: ⚡ 运行 Robolectric 本地单元测试 (我们刚写完的那些)
        run: ./gradlew testDebugUnitTest

      - name: 📦 构建测试版 APK 包
        run: ./gradlew assembleDebug

      - name: 💾 上传 APK 供团队下载安装
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # ==========================================
  # 任务 2：真实的 Android 模拟器自动化 UI 测试
  # (相当于你说的 Docker-Android 替代方案)
  # ==========================================
  emulator-ui-tests:
    needs: build-and-fast-tests # 等待任务 1 成功后再跑
    runs-on: macos-latest       # 🌟 核心：必须用 macOS 机器才能开启硬件加速！
    steps:
      - name: 📥 检出代码 (Checkout code)
        uses: actions/checkout@v4

      - name: ☕ 设置 JDK 17 环境 (Setup JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 赋予 Gradle 运行权限
        run: chmod +x gradlew

      - name: 📱 启动 Android 模拟器并运行 UI 测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29           # 模拟器 Android 10 (API 29)
          target: default
          arch: x86_64
          profile: Nexus 6        # 模拟器机型
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # 核心命令：这会在模拟器里运行你的 androidTest UI 自动化脚本
          script: ./gradlew connectedAndroidTest